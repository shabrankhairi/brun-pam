version: "3.8"

# ==========================================================================
# Brun — versi INSTALLER PUBLIK.
# Bedanya dari docker-compose.yml versi development: service "app" di sini
# pakai `image:` (tarik dari registry), BUKAN `build: ./app`. Artinya server
# yang jalanin file ini TIDAK PERNAH menerima source code apa pun -- cuma
# menerima image binary yang sudah di-build & di-obfuscate sebelumnya.
# ==========================================================================

services:

  guacd:
    image: guacamole/guacd:1.5.5
    container_name: brun-guacd
    restart: unless-stopped
    volumes:
      - session_recordings:/record
    networks:
      - brun_internal
      - brun_devices

  app:
    image: ${BRUN_IMAGE:-ghcr.io/shabrankhairi/brun-app}:${BRUN_VERSION:-latest}
    container_name: brun-app
    restart: unless-stopped
    environment:
      PORT: "3000"
      GUACLITE_PORT: "8081"
      GUACD_HOST: guacd
      GUACD_PORT: "4822"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      TOKEN_CIPHER_KEY: ${TOKEN_CIPHER_KEY:?set TOKEN_CIPHER_KEY in .env, MUST be exactly 32 characters}
      RECORDINGS_DIR: /app/recordings
      KEYSTROKE_LOG_DIR: /app/keystrokes
      AUDIT_LOG_DIR: /app/audit-logs
    volumes:
      - ./data:/app/data
      - session_recordings:/app/recordings:ro
      - keystroke_logs:/app/keystrokes
      - audit_logs:/app/audit-logs
    depends_on:
      - guacd
    networks:
      - brun_internal

  nginx:
    image: nginx:1.27-alpine
    container_name: brun-nginx
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/pam.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - brun_internal

  web-app-browser:
    image: kasmweb/chrome:1.15.0
    container_name: brun-web-browser
    restart: unless-stopped
    shm_size: 512m
    environment:
      VNC_PW: ${WEBAPP_BROWSER_VNC_PW:?set WEBAPP_BROWSER_VNC_PW in .env}
    networks:
      - brun_internal
      - brun_devices

  certgen:
    image: alpine:3.20
    profiles: ["tools"]
    volumes:
      - ./nginx/certs:/certs
    entrypoint: sh
    command:
      - -c
      - >
        apk add --no-cache openssl >/dev/null 2>&1 &&
        openssl req -x509 -nodes -days 365 -newkey rsa:2048
        -keyout /certs/pam.key -out /certs/pam.crt
        -subj "/CN=${BRUN_DOMAIN:-pam.brun.local}" &&
        echo "Certificate created for CN=${BRUN_DOMAIN:-pam.brun.local}"

networks:
  brun_internal:
    driver: bridge
  brun_devices:
    driver: bridge

volumes:
  session_recordings:
  keystroke_logs:
  audit_logs:
